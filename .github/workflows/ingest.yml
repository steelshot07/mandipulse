name: Daily ingestion

# Pulls the latest mandi prices (last 10 days, idempotent) into Postgres.
# Needs repo secrets DATABASE_URL and DATAGOV_API_KEY (Settings → Secrets and variables → Actions).
# Migrations are NOT applied here: run `alembic upgrade head` deliberately before merging schema changes.
on:
  schedule:
    - cron: "30 14 * * *" # 14:30 UTC = 20:00 IST
  workflow_dispatch:
    inputs:
      days:
        description: "Days to re-read (1-60)"
        required: false
        default: "10"

permissions:
  contents: read

# Never run two ingestions at once; a manual run waits for the scheduled one.
concurrency:
  group: ingest-daily
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install .
      - name: Ingest
        env:
          DAYS: ${{ github.event.inputs.days || '10' }}
        run: python -m ingestion.run_daily --days "$DAYS"
