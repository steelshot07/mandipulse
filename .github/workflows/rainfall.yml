name: Weekly rainfall

# Re-reads the last 21 days of IMD real-time gridded rainfall around each mandi.
# IMD (unlike data.gov.in) accepts connections from outside India, so this runs on GitHub.
# Needs repo secret DATABASE_URL. Migrations are not applied here.
on:
  schedule:
    - cron: "30 0 * * 1" # Monday 00:30 UTC = 06:00 IST
  workflow_dispatch:
    inputs:
      days:
        description: "Days to re-read (1-60)"
        required: false
        default: "21"

permissions:
  contents: read

concurrency:
  group: ingest-rainfall
  cancel-in-progress: false

jobs:
  rainfall:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install .
      - name: Ingest rainfall
        env:
          DAYS: ${{ github.event.inputs.days || '21' }}
        run: python -m ingestion.imd_rainfall recent --days "$DAYS"
